[package]
name = "h2tapd"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "Passively keeps HPACK dynamic tables for HTTP/2 5G SBI traffic, so a pcap started mid-connection still decodes"

keywords = ["hpack", "http2", "pcap", "5g", "sbi"]
categories = ["network-programming", "command-line-utilities", "development-tools::debugging"]
repository.workspace = true
homepage.workspace = true
readme.workspace = true
authors.workspace = true

[dependencies]
h2core = { path = "../h2core" }
clap = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tiny_http = { workspace = true }
pnet_datalink = { workspace = true }
libc = { workspace = true }
pcap-file = { workspace = true }
